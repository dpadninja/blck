name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      KS_B64: ${{ secrets.KEY_BASE64 }}
      KS_PASS: ${{ secrets.KEY_STORE_PASSWORD }}
      KEY_PASS: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        run: |
          set -euo pipefail
          missing=()
          [ -n "$KS_B64" ]    || missing+=(SIGNING_KEY)
          [ -n "$KS_PASS" ]   || missing+=(KEY_STORE_PASSWORD)
          [ -n "$KEY_PASS" ]  || missing+=(KEY_PASSWORD)
          [ -n "$KEY_ALIAS" ] || missing+=(ALIAS)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing env: ${missing[*]}"
            exit 1
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Derive version from tag
        id: version
        run: |
          set -euo pipefail
          name="${GITHUB_REF_NAME#v}"
          IFS='.' read -r major minor patch <<< "${name%%-*}"
          code=$(( ${major:-0} * 10000 + ${minor:-0} * 100 + ${patch:-0} ))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Building $name (versionCode $code)"

      - name: Build release APKs
        run: |
          ./gradlew :app:assembleRelease \
            -PversionName='${{ steps.version.outputs.name }}' \
            -PversionCode='${{ steps.version.outputs.code }}'

      - name: Sign APKs
        id: sign
        run: |
          set -euo pipefail
          shopt -s nullglob

          bt_dir="$ANDROID_HOME/build-tools"
          bt="$bt_dir/$(ls "$bt_dir" | sort -V | tail -1)"
          [ -x "$bt/apksigner" ] || { echo "::error::apksigner not found in $bt"; exit 1; }

          ks="$RUNNER_TEMP/release.jks"
          printf '%s' "$KS_B64" | base64 -d > "$ks"

          out="$RUNNER_TEMP/signed"
          mkdir -p "$out"

          apks=(app/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::Gradle no release APKs"
            exit 1
          fi

          for apk in "${apks[@]}"; do
            name="$(basename "$apk")"
            aligned="$RUNNER_TEMP/aligned-$name"
            "$bt/zipalign" -p -f 4 "$apk" "$aligned"
            "$bt/apksigner" sign \
              --ks "$ks" \
              --ks-pass env:KS_PASS \
              --key-pass env:KEY_PASS \
              --ks-key-alias "$KEY_ALIAS" \
              --out "$out/$name" \
              "$aligned"
            "$bt/apksigner" verify --print-certs "$out/$name"
            echo "signed: $name"
          done

          echo "dir=$out" >> "$GITHUB_OUTPUT"

      - name: Cleanup keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ steps.sign.outputs.dir }}/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=(--title "$GITHUB_REF_NAME" --generate-notes)
          case "$GITHUB_REF_NAME" in
            *-*) args+=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" "${args[@]}" \
            "${{ steps.sign.outputs.dir }}"/*.apk
