name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # v1.2.3 -> versionName 1.2.3, versionCode 10203
      # v1.2.3-rc1 -> versionName 1.2.3-rc1, versionCode 10203, релиз помечается pre-release
      - name: Derive version from tag
        id: version
        run: |
          set -euo pipefail
          name="${GITHUB_REF_NAME#v}"
          IFS='.' read -r major minor patch <<< "${name%%-*}"
          code=$(( ${major:-0} * 10000 + ${minor:-0} * 100 + ${patch:-0} ))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Building $name (versionCode $code)"

      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/blck.jks"
          echo "BLCK_KEYSTORE_PATH=$RUNNER_TEMP/blck.jks" >> "$GITHUB_ENV"

      - name: Build release APKs
        env:
          BLCK_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BLCK_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          BLCK_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            -PversionName='${{ steps.version.outputs.name }}' \
            -PversionCode='${{ steps.version.outputs.code }}'

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=(--title "$GITHUB_REF_NAME" --generate-notes)
          case "$GITHUB_REF_NAME" in
            *-*) args+=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" "${args[@]}" \
            app/build/outputs/apk/release/*.apk
